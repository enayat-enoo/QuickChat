# nginx/nginx.scenario-a.conf — Scenario A (Monolith Baseline)
#
# Single backend — no ip_hash needed.
# All traffic goes to node1. This simulates a production monolith
# that has not been scaled horizontally.

worker_processes auto;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    upstream quickchat_nodes {
        server node1:8000;
        keepalive 64;
    }

    log_format thesis '$remote_addr - $upstream_addr [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      'rt=$request_time ut=$upstream_response_time';

    access_log /var/log/nginx/access.log thesis;
    error_log  /var/log/nginx/error.log warn;

    server {
        listen 80;

        location / {
            proxy_pass         http://quickchat_nodes;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout    3600s;
            proxy_send_timeout    3600s;
            proxy_connect_timeout 10s;
        }

        location /api/health {
            proxy_pass         http://quickchat_nodes;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }
    }
}