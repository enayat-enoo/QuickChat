# nginx/nginx.conf — Scenario B (Distributed Cluster)
#
# ip_hash ensures a client always hits the same backend node.
# This is required for WebSocket — the handshake (HTTP Upgrade) and
# all subsequent frames must go to the same server.
# Without it, the Upgrade and data frames can split across nodes
# and the WebSocket connection breaks.

worker_processes auto;

events {
    worker_connections 4096;   # handle up to 4096 simultaneous connections
    use epoll;                 # Linux kernel event model — best for high concurrency
    multi_accept on;
}

http {
    # ── Upstream pool ────────────────────────────────────────────────
    upstream quickchat_nodes {
        ip_hash;               # sticky sessions — same client IP → same node

        server node1:8000;
        server node2:8000;

        keepalive 64;          # reuse connections to backends
    }

    # ── Logging ──────────────────────────────────────────────────────
    log_format thesis '$remote_addr - $upstream_addr [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      'rt=$request_time ut=$upstream_response_time';

    access_log /var/log/nginx/access.log thesis;
    error_log  /var/log/nginx/error.log warn;

    # ── Main server block ────────────────────────────────────────────
    server {
        listen 80;

        # ── WebSocket + HTTP proxy ────────────────────────────────────
        location / {
            proxy_pass         http://quickchat_nodes;
            proxy_http_version 1.1;

            # Required headers for WebSocket upgrade
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";

            # Standard proxy headers
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Timeouts — WebSocket connections are long-lived
            proxy_read_timeout    3600s;
            proxy_send_timeout    3600s;
            proxy_connect_timeout 10s;
        }

        # ── Health check endpoint (bypass load balancer for monitoring) ──
        location /api/health {
            proxy_pass         http://quickchat_nodes;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }
    }
}